[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "filtro-de-excel"
version = "1.0.0"
description = "Sistema simples de filtragem de planilhas (.xlsx, .xlsm, .csv, .tsv)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
filtro-planilha = "filtro.cli:main"

[tool.setuptools]
packages = ["filtro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
