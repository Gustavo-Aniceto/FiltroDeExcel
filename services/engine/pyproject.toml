[project]
name = "excelflow-engine"
version = "0.1.0"
description = "Motor de ingestao, execucao de receitas e exportacao do ExcelFlow"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # Motor analitico embutido: le Parquet com projection/predicate pushdown.
    # E o que torna 500k+ linhas viavel com memoria constante.
    "duckdb>=1.1.3",
    # Leitor de Excel em Rust. Le .xlsx E .xls legado -- ordens de grandeza
    # mais rapido que openpyxl, e cobre o formato antigo que as bibliotecas
    # Node modernas abandonaram.
    "python-calamine>=0.3.1",
    "polars>=1.19.0",
    "pyarrow>=18.1.0",
    # Escrita de .xlsx com formatacao e multiplas abas (Resultado + Resumo).
    "xlsxwriter>=3.2.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
