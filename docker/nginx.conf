server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads de planilha passam por aqui. O padrao do nginx (1 MB) recusaria
    # qualquer arquivo real com um 413 antes mesmo de chegar a API.
    client_max_body_size 128M;
    # Converter uma planilha grande leva minutos; o padrao de 60s cortaria a
    # conexao no meio do processamento.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # A API e servida sob a MESMA origem do frontend. Isso e o que faz o cookie
    # httpOnly de refresh funcionar sem concessoes de SameSite -- e espelha
    # exatamente como o sistema deve rodar em producao.
    location /api/ {
        proxy_pass http://api:3333;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # Assets com hash no nome podem ser cacheados para sempre; o index.html
    # nunca, senao o navegador serviria uma versao antiga apos o deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota desconhecida devolve o index, e o React Router resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
